{% set name = "modflow6" %}
{% set version = "6.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/MODFLOW-USGS/modflow6/releases/download/{{ version }}/mf{{ version }}_linux.zip
  sha256: 33edf988b672a9f282d6773304c079d0f180541f6fe0c6555265d9c71841256e

build:
  number: 0
  # mf6 embeds the build prefix in a Fortran string literal via
  # compiler_options(). Fortran literals are length-counted rather than
  # NUL-terminated, so substituting the prefix at install time shifts the
  # literals packed behind it and corrupts them.
  detect_binary_files_with_prefix: false
  # upstream no longer supports Intel macOS
  skip: true  # [osx and x86_64]

requirements:
  build:
    - {{ compiler('fortran') }}   # [not win]
    - {{ stdlib("c") }}           # [not win]
    - gfortran                    # [win]
    - meson >=1.7.1
    - ninja
  run:
    - libgfortran                 # [win]

test:
  commands:
    - mf6 --help
    - mf6 --license
    - mf6 --compiler
    - mf6 --compiler-opt
    # mf5to6 has no --help or --version flag and prompts on stdin
    - test -f $PREFIX/bin/mf5to6                    # [unix]
    - if not exist %LIBRARY_BIN%\mf5to6.exe exit 1  # [win]

about:
  home: https://www.usgs.gov/software/modflow-6-usgs-modular-hydrologic-model
  license: CC0-1.0
  license_family: CC
  license_file: LICENSE.md
  summary: USGS Modular Hydrologic Model
  description: |
    MODFLOW 6 is an object-oriented program and framework developed to provide
    a platform for supporting multiple models and multiple types of models
    within the same simulation. Within this framework, a regional-scale
    groundwater model may be coupled with multiple local-scale groundwater
    models. Or, a groundwater flow model could be coupled to a groundwater
    transport model of a single solute species.
  doc_url: https://water.usgs.gov/water-resources/software/MODFLOW-6/mf6io_{{ version }}.pdf
  dev_url: https://github.com/MODFLOW-ORG/modflow6

extra:
  recipe-maintainers:
    - mwtoews
    - jdhughes-dev
    - Hofer-Julian
    - scopatz
    - scharlton2
